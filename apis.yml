aid: globetouch
name: Globetouch
description: 'Globetouch is a global mobile and IoT connectivity provider founded in 2010 and
  headquartered in San Ramon, California, which rebranded to Airlinq in February 2020 — globetouch.com
  now 301-redirects to www.airlinq.com. Its GConnect / CloudSIM heritage (physical SIM, soft SIM and
  eSIM provisioning with rule-engine-driven subscription-profile management for mobile operators and
  IoT enterprises) is carried forward in Mobilinq, the company''s IoT connectivity and application
  management platform, alongside Autolinq for the connected-vehicle ecosystem, Utilinq for electric,
  gas and water utilities, and Marketlinq, an operator-branded private-5G and IoT marketplace and
  dashboard. Airlinq markets a "comprehensive API library" for BSS/OSS integration and data and voice
  plans "enabled via API", but as of August 2026 it publishes no public developer portal, API
  reference, or machine-readable specification of any kind; the only entry point is a contact-sales
  form.'
